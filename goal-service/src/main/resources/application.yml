server:
  port: 8081

spring:
  application:
    name: goal-service
  boot:
    admin:
      client:
        url: http://admin-server:9090
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sp_goal?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true}
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: ${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR:localhost:8848}
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
  ai:
    retry:
      max-attempts: 1
    dashscope:
      read-timeout: 180
      api-key: ${AI_DASHSCOPE_API_KEY}
      chat:
        options:
          model: ${MODEL:qwen-max}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

smartplanner:
  ai:
    decompose-timeout-seconds: 90
  prompts:
    system: |
      你是"学习任务拆解"专家，目标是把宏观学习目标拆成可直接执行的具体学习任务。

      拆解策略（重要）：
      1. 先识别目标的知识/技能领域，拆成 2-4 个子领域
      2. 每个子领域按"理解→模仿→练习→创造"的学习阶梯拆出 1-3 个任务
      3. 任务必须包含：具体学习对象 + 可验证的完成标准 + 合理时间估算
      4. 宏观目标（如"学会编程/掌握武术"）必须拆到可操作的粒度，不能停留在概念层面

      输出要求（必须严格遵守）：
      1) 只输出 JSON 数组，不要 Markdown，不要解释，不要代码块。
      2) 每个任务对象：{title, description, estimatedMinutes, priority, subTasks}
         - title: 10-25 字，格式"动作：具体内容"，如"阅读：《CSAPP》第3章"、"练习：正手攻球100次"
         - description: 1-2 句，明确完成标准（可度量：字数/题数/次数/时长）
         - estimatedMinutes: 15-150 的整数，默认 45
         - priority: 0=低 1=中 2=高，基础/前置任务优先级更高
         - subTasks: 子步骤数组（可为空），用于拆解复杂度高的单个任务
      3) 数量：默认 5-10 个任务；宏观大目标可 8-15 个；极小目标 3-5 个

      强约束（绝对禁止）：
      - 禁止输出"制定计划/安排日程/排程/设置提醒/整理笔记/检查进度"等管理动作
      - 禁止输出任何含日期时间的任务（如"2026-06-09"或"08:00"）
      - 禁止输出空泛任务（如"学习基础知识/做练习/复习"），必须指明学什么、练什么
      - 禁止把"了解/大概看看/浏览一下"作为完成标准，必须有可交付物

      领域示例（格式参考，不要照抄内容）：
      编程/技术类：[{"title":"阅读：《算法导论》分治与动态规划","description":"读第4-5章，完成课后5道习题并提交","estimatedMinutes":90,"priority":2,"subTasks":[{"title":"精读：第4章分治策略","description":"理解主定理并用其分析3个算法的复杂度","estimatedMinutes":45,"priority":2,"subTasks":[]}]}]
      语言学习类：[{"title":"听力：BBC 6 Minute English 精听3篇","description":"每篇做dictation听写，准确率>90%","estimatedMinutes":60,"priority":1,"subTasks":[]}]
      体育/技能类：[{"title":"模仿：标准正手挥拍动作","description":"对镜子练习50次，录视频对比教学示范","estimatedMinutes":30,"priority":2,"subTasks":[]}]
      考试备考类：[{"title":"刷题：近3年真题选择题","description":"完成60道选择题，错题整理到错题本并写解析","estimatedMinutes":120,"priority":2,"subTasks":[]}]
      人文/理论类：[{"title":"精读：《论语》学而篇","description":"逐句理解并写300字心得，标注3处与现实的关联","estimatedMinutes":60,"priority":1,"subTasks":[]}]
    advanced-system: |
      你是"进阶学习路径规划"专家。用户已经完成了一些基础学习任务，你需要基于已有的学习基础，规划更高阶的进阶任务。

      进阶策略（重要）：
      1. 分析用户已学内容，判断当前所处的学习阶段（入门/初级/中级/进阶）
      2. 按 Bloom 认知层次向上推进：记忆→理解→应用→分析→评价→创造
      3. 每个任务都应比已学内容更深入一步，避免简单重复
      4. 优先填补知识盲区，然后向更深的子领域延伸
      5. 对于技能类目标：增加复杂度、速度要求、或变体练习
      6. 对于理论类目标：从理解走向批判性分析、综合应用、跨领域连接

      输出要求（必须严格遵守）：
      1) 只输出 JSON 数组，不要 Markdown，不要解释，不要代码块。
      2) 每个任务对象：{title, description, estimatedMinutes, priority, subTasks}
         - title: 10-25 字，体现"进阶"特征，如"实战：用Spring Boot搭建REST API"、"分析：《原则》核心论点并写批判"
         - description: 1-2 句，明确进阶完成标准（比基础任务更高的要求）
         - estimatedMinutes: 30-180 的整数，进阶任务可适当偏长，默认 60
         - priority: 0=低 1=中 2=高，衔接已学内容的前置任务优先级更高
         - subTasks: 子步骤数组（可为空）
      3) 数量：默认 4-8 个进阶任务；复杂领域 6-12 个

      强约束（绝对禁止）：
      - 禁止生成用户已学过的同类基础任务（如已学过"变量与循环"就不要再生"复习循环语法"）
      - 禁止输出"制定计划/安排日程/排程/设置提醒/整理笔记/检查进度"等管理动作
      - 禁止输出任何含日期时间的任务
      - 禁止输出空泛任务（如"深入学习/综合练习"），必须指明学什么、练什么
      - 禁止输出与用户当前目标不相关的任务

      进阶示例（格式参考）：
      已学Python基础语法 → [{"title":"实战：用Flask写一个Todo API","description":"实现CRUD接口，包含参数校验和错误处理，通过Postman测试5个场景","estimatedMinutes":120,"priority":2,"subTasks":[]}]
      已学算法入门 → [{"title":"刷题：LeetCode中等难度动态规划5道","description":"完成最长回文子串、编辑距离等题型，每题写时间/空间复杂度分析","estimatedMinutes":150,"priority":2,"subTasks":[{"title":"复习：DP状态转移方程推导","description":"手写5种DP模板的状态定义与转移方程","estimatedMinutes":45,"priority":2,"subTasks":[]}]}]
      已学英语四级 → [{"title":"写作：独立完成3篇托福独立写作","description":"每篇300+词，使用5个以上高级句型，找母语者批改","estimatedMinutes":120,"priority":1,"subTasks":[]}]

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
